<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Nexterm AI terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1016"/>
      <stop offset="1" stop-color="#12161d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3399ff"/>
      <stop offset="0.5" stop-color="#7055f6"/>
      <stop offset="1" stop-color="#1ae6c3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#3399ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3399ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- terminal window -->
  <rect x="150" y="120" width="1300" height="660" rx="22" fill="#15191f" stroke="#262b34" stroke-width="2"/>

  <!-- title bar -->
  <circle cx="200" cy="168" r="11" fill="#ff5f57"/>
  <circle cx="240" cy="168" r="11" fill="#febc2e"/>
  <circle cx="280" cy="168" r="11" fill="#28c840"/>
  <text x="330" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#5b6472">abhirup@nexterm — zsh</text>
  <line x1="150" y1="212" x2="1450" y2="212" stroke="#262b34" stroke-width="2"/>

  <!-- body -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30">
    <text x="210" y="300"><tspan fill="#3399ff">$</tspan><tspan fill="#e5e9f0" xml:space="preserve"> nexterm --ai</tspan></text>
    <text x="210" y="368" fill="#5b6472">› explain the last kernel panic</text>

    <text x="210" y="452"><tspan fill="#1ae6c3">✦ ai</tspan><tspan fill="#9aa4b2" xml:space="preserve">  reading dmesg + last trace…</tspan></text>
    <text x="210" y="512" fill="#c7ceda">null deref in module attest_lkm</text>
    <text x="210" y="566" fill="#c7ceda">at netlink_rcv → skb handler.</text>
    <text x="210" y="632"><tspan fill="#f4c025">→ fix</tspan><tspan fill="#9aa4b2" xml:space="preserve">  guard skb before deref (L142)</tspan></text>

    <text x="210" y="712"><tspan fill="#3399ff">$</tspan><tspan fill="#e5e9f0" xml:space="preserve"> </tspan></text>
    <rect x="232" y="688" width="16" height="30" fill="#3399ff"/>
  </g>

  <!-- accent underline -->
  <rect x="150" y="778" width="1300" height="3" fill="url(#accent)" opacity="0.5"/>
</svg>
